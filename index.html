<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Kelvin Kennedy" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Order crisps, muffins, samosas, popcorn and sweet treats online. Delivery across Kenya. Pay with M-Pesa, card or cash on delivery."
    />
    <meta name="theme-color" content="#e8344e" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="A Plus Snacks" />
    <meta property="og:title" content="A Plus Snacks | Order snacks online in Kenya" />
    <meta
      property="og:description"
      content="Crisps, muffins, samosas, popcorn and sweet treats. Delivery across Kenya. Pay with M-Pesa, card or cash on delivery."
    />
    <!-- Add once your domain is known (must be a full URL):
    <meta property="og:image" content="https://YOUR-DOMAIN/images/slides/snack1.jpg" />
    -->
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "A Plus Snacks",
        "description": "Fresh snacks delivered across Kenya.",
        "areaServed": "KE",
        "currenciesAccepted": "KES",
        "paymentAccepted": "M-Pesa, Card, Cash on delivery"
      }
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BF%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/hover.css" />
    <link rel="stylesheet" href="css/rounded.css" />
    <link rel="stylesheet" href="css/slideshow.css" />
    <link rel="stylesheet" href="css/extras.css" />
    <title>A Plus Snacks | Order snacks online in Kenya</title>
    <style>
      /* Landing page: the welcome section fills the screen */
      .home main { min-height: calc(100vh - 330px); display: flex; align-items: center; }
      .home main .hero { width: 100%; }
    </style>
  </head>
  <body class="home">
    <div class="ann" id="ann" hidden></div>
    <header id="top">
      <div class="wrap bar">
        <a class="logo" href="index.html" id="logo">A Plus Snacks</a>
        <nav class="nav" id="nav" aria-label="Main">
          <a href="index.html" class="on">Home</a>
          <a href="shop.html">Products</a>
          <a href="about.html">About</a>
          <a href="#contact">Contact</a>
          <a href="shop.html#account">Account</a>
        </nav>
        <button class="cartbtn" id="openCart" aria-label="Open cart">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.8L20 7H6"/></svg>
          <span class="cartlabel">Cart</span>
          <span class="count" id="count">0</span>
        </button>
        <button
          class="menubtn"
          id="menuBtn"
          aria-label="Menu"
          aria-expanded="false"
          aria-controls="nav"
        >
          <i></i>
        </button>
      </div>
    </header>

    <main>
      <section class="wrap hero">
        <div class="hero-text">
          <span class="eyebrow" id="eyebrow">Fresh snacks</span>
          <h1 id="heroTitle">Snack Time, Grab your Favourite.</h1>
          <p id="heroText"></p>
          <a class="btn" href="shop.html">Shop now</a>
        </div>
        <div class="hero-art slideshow" id="slideshow">
          <img src="images/slides/snack1.jpg" width="600" height="600" alt="A platter of fresh snacks from A Plus Snacks" fetchpriority="high" />
        </div>
      </section>

          </main>


    <!-- ── SOCIAL ICONS ── -->
    <section class="social-section" id="contact">
      <p class="social-label">Follow &amp; Connect</p>
      <div class="social-container">
        <!-- Email is hidden until a real link is added. Replace the placeholder, then remove the comment marks.
        <div class="icon-item">
          <a href="mailto:YOUR_EMAIL@example.com" class="icon-box mail" aria-label="Email us">
            <div class="tooltip">Email Us</div>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="M3 7l9 6 9-6" />
            </svg>
          </a>
          <span class="icon-name">Email</span>
        </div>
        -->

        <!-- Facebook is hidden until a real link is added. Replace the placeholder, then remove the comment marks.
        <div class="icon-item">
          <a
            href="https://www.facebook.com/YOUR_FACEBOOK_PAGE"
            target="_blank"
            rel="noopener"
            class="icon-box facebook"
            aria-label="Facebook"
          >
            <div class="tooltip">Facebook</div>
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M13.5 21v-8h2.7l.4-3.2h-3.1V7.8c0-.9.3-1.5 1.6-1.5h1.7V3.4c-.3 0-1.3-.1-2.4-.1-2.4 0-4.1 1.5-4.1 4.2v2.3H7.5V13h2.8v8h3.2z"
              />
            </svg>
          </a>
          <span class="icon-name">Facebook</span>
        </div>
        -->

        <!-- Instagram is hidden until a real link is added. Replace the placeholder, then remove the comment marks.
        <div class="icon-item">
          <a
            href="https://www.instagram.com/YOUR_INSTAGRAM_HANDLE"
            target="_blank"
            rel="noopener"
            class="icon-box instagram"
            aria-label="Instagram"
          >
            <div class="tooltip">Instagram</div>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="3" width="18" height="18" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
            </svg>
          </a>
          <span class="icon-name">Instagram</span>
        </div>

        <div class="icon-item">
          <a
            id="waLink"
            href="#"
            target="_blank"
            rel="noopener"
            class="icon-box whatsapp"
            aria-label="Chat on WhatsApp"
          >
            <div class="tooltip">WhatsApp</div>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z" />
              <path
                d="M9 8.5c.3 2.6 2.9 5.2 5.5 5.5l1.4-1.4-2-1-.9.8c-.9-.4-1.8-1.3-2.2-2.2l.8-.9-1-2L9 8.5z"
              />
            </svg>
          </a>
          <span class="icon-name">WhatsApp</span>
        </div>

        <div class="icon-item">
          <a
            href="https://www.google.com/maps/search/?api=1&amp;query=-1.108793,36.640887"
            target="_blank"
            rel="noopener"
            class="icon-box location"
            aria-label="Get Directions"
          >
            <div class="tooltip">Get Directions</div>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
          </a>
          <span class="icon-name">Location</span>
        </div>
      </div>
    </section>

    <!-- ── FOOTER ── -->
    <footer class="site-foot">
      <span id="footer">&copy; 2026 A Plus Snacks. All rights reserved.</span>
    </footer>


    <script src="js/slideshow.js" defer></script>
    <script type="module" src="js/home.js"></script>
  </body>
</html>
