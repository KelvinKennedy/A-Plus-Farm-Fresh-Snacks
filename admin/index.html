<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>A Plus Admin</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <div id="login" class="center" hidden>
      <div class="panel narrow">
        <h1>Shop admin</h1>
        <div id="setup" class="err" hidden>
          Firebase is not connected yet. Open
          <code>js/config.js</code>
          , paste your Firebase settings, and reload this page. The README has the steps.
        </div>
        <div id="lform">
          <label for="em">Email</label>
          <input class="f" id="em" type="email" autocomplete="username" />
          <label for="pw">Password</label>
          <input class="f" id="pw" type="password" autocomplete="current-password" />
          <div class="err" id="lerr" role="alert"></div>
          <button class="b" id="lbtn" style="width: 100%; margin-top: 12px">Sign in</button>
        </div>
      </div>
    </div>

    <div id="app" hidden>
      <header>
        <strong>Shop admin</strong>
        <nav id="tabs">
          <a data-tab="dash" href="#dash">Dashboard</a>
          <a data-tab="products" href="#products">Products</a>
          <a data-tab="orders" href="#orders">Orders</a>
          <a data-tab="users" href="#users">Users</a>
          <a data-tab="account" href="#account">Accounts</a>
          <a data-tab="settings" href="#settings">Settings</a>
        </nav>
        <span class="sp"></span>
        <a href="../" target="_blank" rel="noopener">View shop</a>
        <button class="b ghost" id="logout">Sign out</button>
      </header>
      <main id="view"></main>
    </div>
    <div id="toast" role="status"></div>
    <script type="module" src="admin.js"></script>
  </body>
</html>
